name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, build, and validate screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17 and Gradle
        uses: ./.github/actions/setup-android

      - name: Check vendored relay vectors against the public plugin release
        run: tools/check-relay-vectors.sh

      - name: Verify fake Hermes contract rig
        shell: bash
        run: |
          python3 -m unittest discover -s tools/fake-hermes -p 'test_*.py' -v
          python3 tools/fake-hermes/fake_hermes.py 8787 > "$RUNNER_TEMP/fake-hermes.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if python3 -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8787/api/status", timeout=1)' 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          python3 tools/fake-hermes/verify.py 8787

      - name: Run verification gates
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug validateDebugScreenshotTest :shared:mercury-core:check

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
