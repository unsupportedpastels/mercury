name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, build, and validate screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check vendored relay vectors against the public plugin release
        run: tools/check-relay-vectors.sh

      - name: Verify fake Hermes contract rig
        shell: bash
        run: |
          python3 -m unittest discover -s tools/fake-hermes -p 'test_*.py' -v
          python3 tools/fake-hermes/fake_hermes.py 8787 > "$RUNNER_TEMP/fake-hermes.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if python3 -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8787/api/status", timeout=1)' 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          python3 tools/fake-hermes/verify.py 8787

      - name: Run verification gates
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug validateDebugScreenshotTest :shared:mercury-core:check

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
