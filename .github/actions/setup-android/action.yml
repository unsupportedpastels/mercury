name: Set up Android build environment
description: >-
  Installs Temurin JDK 17 and configures Gradle with dependency caching. Shared
  by every workflow that runs ./gradlew. The caller must run actions/checkout
  first: a repository-local composite action cannot be resolved until the tree
  exists on the runner.

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
