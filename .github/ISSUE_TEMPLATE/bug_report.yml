name: Bug report
description: Report a reproducible Mercury problem without sensitive data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include server URLs, credentials, cookies, WebSocket tickets, Relay pairing codes, prompts, transcripts, or attachments. Report security-sensitive issues privately as described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mercury version or commit
      placeholder: 0.2.3 or abc1234
    validations:
      required: true
  - type: dropdown
    id: connection_mode
    attributes:
      label: Connection mode
      options:
        - Self-hosted server URL
        - Hermes Cloud
        - Mercury Relay
        - Not sure / not applicable
    validations:
      required: true
  - type: dropdown
    id: device_class
    attributes:
      label: Device posture
      description: The window the app was in when the problem happened.
      options:
        - Phone / compact window
        - Fold or Flip cover screen
        - Fold unfolded / expanded window
        - Tablet or iPad
        - Split screen, Stage Manager, DeX, or freeform window
        - Other
    validations:
      required: true
