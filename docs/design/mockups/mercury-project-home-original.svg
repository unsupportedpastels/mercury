<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932">
  <rect width="430" height="932" fill="#000000"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }
    .primary { fill:#f7f7f8; }
    .secondary { fill:#99999f; }
    .muted { fill:#6f7076; }
    .accent { fill:#706cf6; }
  </style>

  <!-- iOS status bar -->
  <text x="28" y="31" class="primary" font-size="15" font-weight="700">3:18</text>
  <g transform="translate(345 18)" fill="none" stroke="#f7f7f8" stroke-width="2" stroke-linecap="round">
    <path d="M0 10h2M6 8h2M12 5h2M18 2h2"/>
    <path d="M31 9c4-5 10-5 14 0M34 12c2-3 6-3 8 0"/>
    <rect x="53" y="2" width="22" height="11" rx="3"/><path d="M76 6v3"/>
  </g>

  <!-- toolbar capsules -->
  <rect x="18" y="52" width="116" height="48" rx="24" fill="#171719"/>
  <circle cx="43" cy="76" r="12" fill="none" stroke="#9a9ba1" stroke-width="1.8"/>
  <circle cx="43" cy="72" r="4" fill="#9a9ba1"/>
  <path d="M36 84c1-6 13-6 14 0" fill="#9a9ba1"/>
  <text x="62" y="82" class="secondary" font-size="15">default</text>

  <rect x="194" y="52" width="218" height="48" rx="24" fill="#171719"/>
  <g fill="none" stroke="#9a9ba1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M220 72h19v13h-19zM220 72l4-5h7l3 5"/>
    <path d="M270 66v20M260 76h20"/>
    <circle cx="322" cy="76" r="9"/><path d="M322 62v4M322 86v4M308 76h4M332 76h4"/>
    <path d="M369 68h18v15h-18zM373 68v-3h10v3M374 75h8"/>
  </g>

  <text x="20" y="145" class="primary" font-size="38" font-weight="750">Mercury</text>
  <text x="22" y="176" class="secondary" font-size="14" font-weight="600">Hermes 0.20.5</text>

  <!-- Original concept: horizontal project filter -->
  <g transform="translate(20 204)">
    <text x="0" y="0" class="secondary" font-size="12" font-weight="700" letter-spacing="1.4">PROJECTS</text>
    <g transform="translate(0 17)">
      <rect x="0" y="0" width="70" height="36" rx="18" fill="#706cf6"/>
      <circle cx="20" cy="18" r="5" fill="#ffffff"/>
      <text x="33" y="23" fill="#ffffff" font-size="14" font-weight="700">Home</text>

      <rect x="78" y="0" width="99" height="36" rx="18" fill="#171719"/>
      <text x="92" y="23" class="primary" font-size="14" font-weight="600">Security</text>

      <rect x="185" y="0" width="136" height="36" rx="18" fill="#171719"/>
      <text x="198" y="23" class="primary" font-size="13" font-weight="600">Mobile Client</text>

      <rect x="329" y="0" width="68" height="36" rx="18" fill="#171719"/>
      <text x="339" y="23" class="primary" font-size="13" font-weight="600">Data Pipeline</text>
    </g>
    <text x="0" y="75" class="muted" font-size="13">Home shows recent work across every project</text>
  </g>

  <g transform="translate(20 308)">
    <text x="0" y="0" class="primary" font-size="21" font-weight="750">Recent across projects</text>
    <text x="347" y="0" class="accent" font-size="14" font-weight="650" text-anchor="end">View all</text>
  </g>

  <!-- continuous Mercury list surface -->
  <rect x="18" y="329" width="394" height="491" rx="26" fill="#0a0a0b"/>

  <g transform="translate(38 360)">
    <text x="0" y="0" class="primary" font-size="18" font-weight="700">Prepare mobile release</text>
    <text x="0" y="28" class="secondary" font-size="14">Verify the latest client build…</text>
    <rect x="0" y="45" width="112" height="25" rx="12.5" fill="#18181a"/>
    <text x="12" y="62" class="secondary" font-size="11" font-weight="650">Mobile Client</text>
    <text x="340" y="31" class="muted" font-size="24">›</text>
    <line x1="0" y1="91" x2="354" y2="91" stroke="#29292c"/>
  </g>

  <g transform="translate(38 474)">
    <text x="0" y="0" class="primary" font-size="18" font-weight="700">Review finding clusters</text>
    <text x="0" y="28" class="secondary" font-size="14">Reconcile effects and asset rationale…</text>
    <rect x="0" y="45" width="78" height="25" rx="12.5" fill="#18181a"/>
    <text x="12" y="62" class="secondary" font-size="11" font-weight="650">Security Dashboard</text>
    <text x="340" y="31" class="muted" font-size="24">›</text>
    <line x1="0" y1="91" x2="354" y2="91" stroke="#29292c"/>
  </g>

  <g transform="translate(38 588)">
    <text x="0" y="0" class="primary" font-size="18" font-weight="700">Fix mobile transcript loading</text>
    <text x="0" y="28" class="secondary" font-size="14">Repair markdown and tool history…</text>
    <rect x="0" y="45" width="68" height="25" rx="12.5" fill="#18181a"/>
    <text x="12" y="62" class="secondary" font-size="11" font-weight="650">Mercury</text>
    <text x="340" y="31" class="muted" font-size="24">›</text>
    <line x1="0" y1="91" x2="354" y2="91" stroke="#29292c"/>
  </g>

  <g transform="translate(38 702)">
    <text x="0" y="0" class="primary" font-size="18" font-weight="700">Synchronization status</text>
    <text x="0" y="28" class="secondary" font-size="14">Validate provider freshness and sync…</text>
    <rect x="0" y="45" width="68" height="25" rx="12.5" fill="#18181a"/>
    <text x="12" y="62" class="secondary" font-size="11" font-weight="650">Data Pipeline</text>
    <text x="340" y="31" class="muted" font-size="24">›</text>
  </g>

  <!-- project-aware quick action -->
  <rect x="247" y="845" width="165" height="54" rx="27" fill="#706cf6"/>
  <path d="M276 866v14M269 873h14" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="307" y="878" fill="#ffffff" font-size="15" font-weight="700">New chat</text>
  <rect x="0" y="916" width="430" height="16" fill="#000000"/>
</svg>
