name: Mercury

options:
  bundleIdPrefix: com.unsupportedpastels
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    MERCURY_APP_GROUP_IDENTIFIER: group.com.unsupportedpastels.mercury
    # Version story mirrors Android (versionName / versionCode in
    # app/build.gradle.kts). Applied project-wide so the app and its embedded
    # extensions always carry the same CFBundleShortVersionString and build
    # number, which App Store validation requires. Bump MARKETING_VERSION with
    # each release alongside versionName.
    MARKETING_VERSION: "0.2.5"
    CURRENT_PROJECT_VERSION: 3

# One producer shared by app, PreviewKit and extension. Never depend on the
# app's build phases: the app itself depends on both notification targets.
aggregateTargets:
  MercuryCoreBuild:
    targets: []
    settings:
      base:
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        USER_SCRIPT_SANDBOXING: NO
    buildScripts:
      - name: Build MercuryCore KMP framework
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/MercuryCore.framework/MercuryCore
          - $(BUILT_PRODUCTS_DIR)/MercuryCore.framework/Headers/MercuryCore.h
          - $(BUILT_PRODUCTS_DIR)/MercuryCore.framework/Modules/module.modulemap
        script: |
          set -eu
          # Static KMP frameworks must be linked, not embedded or signed.
          if ! command -v java >/dev/null 2>&1 && [ -z "${JAVA_HOME:-}" ]; then
            echo "error: building MercuryCore requires a JDK (brew install openjdk@17)"
            exit 1
          fi
          case "$SDK_NAME" in
            iphonesimulator*) KT_TARGET=IosSimulatorArm64; KT_DIR=iosSimulatorArm64 ;;
            iphoneos*)        KT_TARGET=IosArm64;          KT_DIR=iosArm64 ;;
            *) echo "error: unsupported SDK_NAME=$SDK_NAME for MercuryCore"; exit 1 ;;
          esac
          CONF_LC=$(printf %s "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')
          cd "$SRCROOT/.."
          ./gradlew ":shared:mercury-core:link${CONFIGURATION}Framework${KT_TARGET}"
          # Stage into this Xcode build's products, never a previous app build.
          mkdir -p "$BUILT_PRODUCTS_DIR"
          rsync -a --delete "$SRCROOT/../shared/mercury-core/build/bin/$KT_DIR/${CONF_LC}Framework/MercuryCore.framework" "$BUILT_PRODUCTS_DIR/"

targets:
  MercuryNotificationPreviewKit:
    type: framework.static
    platform: iOS
    sources:
      - MercuryNotificationPreviewKit
    dependencies:
      - target: MercuryCoreBuild
    settings:
      base:
        # A static adapter avoids a second Kotlin runtime inside a dynamic
        # PreviewKit alongside the app's own static MercuryCore linkage.
        MACH_O_TYPE: staticlib
        APPLICATION_EXTENSION_API_ONLY: YES
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.unsupportedpastels.mercury.notificationpreviewkit

  MercuryShareKit:
    type: framework
    platform: iOS
    sources:
      - MercuryShareKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.unsupportedpastels.mercury.sharekit

  Mercury:
    type: application
    platform: iOS
    sources:
      - Mercury
      - Resources
    dependencies:
      - target: MercuryNotificationPreviewKit
        embed: false
      - sdk: MercuryCore.framework
        embed: false
      - target: MercuryNotificationService
        embed: true
      - target: MercuryShareKit
      - target: MercuryShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unsupportedpastels.mercury
        CODE_SIGN_ENTITLEMENTS: Mercury/Mercury.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Produced by MercuryCoreBuild before PreviewKit or app compilation.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
      configs:
        Debug:
          MERCURY_APNS_ENVIRONMENT: development
        Release:
          MERCURY_APNS_ENVIRONMENT: production
    info:
      path: Mercury/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Mercury
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Mercury uses the microphone only while you dictate a message draft.
        NSSpeechRecognitionUsageDescription: Mercury uses speech recognition to place dictated words into your message draft.
        NSCameraUsageDescription: Mercury uses the camera only to scan a Mercury Relay pairing QR code.
        MercuryAppGroupIdentifier: $(MERCURY_APP_GROUP_IDENTIFIER)
        MercuryPrivateKeychainAccessGroup: $(AppIdentifierPrefix)com.unsupportedpastels.mercury
        MercuryPreviewKeychainAccessGroup: $(AppIdentifierPrefix)com.unsupportedpastels.mercury.preview
        # Plain-HTTP is a supported configuration for LAN self-hosted servers
        # (the "Use HTTPS" checkbox off). Scoped ATS exception: local
        # networking only — cleartext to public hosts stays blocked.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Best-effort background notifications (no APNs): iOS may opportunistically
        # wake the app to reconcile session state and post local notifications.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.unsupportedpastels.mercury.reconcile
        # Visible APNs alerts do not require silent/background execution.
        # Canonical session deep links (notification taps).
        CFBundleURLTypes:
          - CFBundleURLName: com.unsupportedpastels.mercury.session
            CFBundleURLSchemes:
              - mercury

  MercuryShare:
    type: app-extension
    platform: iOS
    sources:
      - MercuryShare
    dependencies:
      - target: MercuryShareKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unsupportedpastels.mercury.share
        CODE_SIGN_ENTITLEMENTS: MercuryShare/MercuryShare.entitlements
    info:
      path: MercuryShare/Info.plist
      properties:
        CFBundleDisplayName: Add to Mercury
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MercuryAppGroupIdentifier: $(MERCURY_APP_GROUP_IDENTIFIER)
        MercuryPreviewKeychainAccessGroup: $(AppIdentifierPrefix)com.unsupportedpastels.mercury.preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 5

  MercuryNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - MercuryNotificationService
    dependencies:
      - target: MercuryNotificationPreviewKit
        embed: false
      - sdk: MercuryCore.framework
        embed: false
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
        PRODUCT_BUNDLE_IDENTIFIER: com.unsupportedpastels.mercury.notification-service
        CODE_SIGN_ENTITLEMENTS: MercuryNotificationService/MercuryNotificationService.entitlements
      configs:
        Debug:
          MERCURY_PREVIEW_APNS_ENVIRONMENT: sandbox
        Release:
          MERCURY_PREVIEW_APNS_ENVIRONMENT: production
    info:
      path: MercuryNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Mercury Notification Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MercuryAPNSEnvironment: $(MERCURY_PREVIEW_APNS_ENVIRONMENT)
        MercuryPreviewKeychainAccessGroup: $(AppIdentifierPrefix)com.unsupportedpastels.mercury.preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  MercuryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MercuryTests
      - path: ../shared/mercury-core/src/commonTest/resources/adapter-parity/chat-event-corpus.json
        buildPhase: resources
      - path: ../shared/mercury-core/src/commonTest/resources/adapter-parity/relay-recovery.json
        buildPhase: resources
      # Relay protocol vectors are vendored once, beside the shared core's
      # own corpus test; tools/check-relay-vectors.sh pins them to the plugin.
      - path: ../shared/mercury-core/src/commonTest/resources/relay-protocol/frames-corpus.json
        buildPhase: resources
      - path: ../shared/mercury-core/src/commonTest/resources/relay-protocol/secure-channel-corpus.json
        buildPhase: resources
      - path: ../shared/mercury-core/src/commonTest/resources/push-preview/v1-vector.json
        buildPhase: resources
      - path: ../shared/mercury-core/src/commonTest/resources/push-preview/host-multiline.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # @testable import Mercury exposes public signatures backed by the
        # static KMP module, so the test compiler must resolve MercuryCore too.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
    dependencies:
      - target: Mercury
      - target: MercuryShareKit
      - target: MercuryNotificationPreviewKit
        embed: false

  # Live integration tests: hit an operator-supplied Hermes origin and Nous Portal.
  # Kept in a separate target so the default MercuryTests suite stays hermetic
  # and offline. Run explicitly: -scheme MercuryLiveTests.
  MercuryLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MercuryLiveTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Mercury

  # XCUITest driver for simulator verification (simctl cannot tap/type).
  MercuryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MercuryUITests
        excludes:
          - "Diagnostics/**"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Mercury

  # Physical-device diagnostic harness (photo picker). Skips on the simulator
  # and needs MERCURY_PHYSICAL_PICKER_DIAGNOSTICS=1, so it lives outside the
  # default UI-test target and never counts as gate coverage.
  MercuryDeviceDiagnosticUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MercuryUITests/Diagnostics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Mercury

schemes:
  Mercury:
    build:
      targets:
        Mercury: all
    test:
      targets:
        - MercuryTests
  MercuryLiveTests:
    build:
      targets:
        Mercury: all
        MercuryLiveTests: all
    test:
      targets:
        - MercuryLiveTests
  MercuryUITests:
    build:
      targets:
        Mercury: all
        MercuryUITests: all
    test:
      targets:
        - MercuryUITests
  MercuryDeviceDiagnosticUITests:
    build:
      targets:
        Mercury: all
        MercuryDeviceDiagnosticUITests: all
    test:
      targets:
        - MercuryDeviceDiagnosticUITests
